# Render blueprint — the whole product, two services, one platform.
#
#   New > Blueprint > pick this repo. Render reads this, creates both services,
#   and prompts for the values marked `sync: false`.
#
# Why two and not three: the Node service also serves the built client, so the
# app and its API share one origin. That removes CORS, removes a second host,
# and removes a build-time API URL that has to stay in sync with it.
#
# Why two and not one: Node and Python are different runtimes, and the split is
# the point of the architecture — prompts and retrieval are tuned weekly while
# auth and CRUD are not, so the AI service must redeploy without touching the
# application the creator is logged into.

services:
  # --------------------------------------------------------------- AI service
  - type: web
    name: asw-ai
    runtime: docker
    plan: free
    region: oregon
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /internal/health
    envVars:
      # Must match AI_SERVICE_TOKEN on the application service. This is the only
      # thing standing between the open internet and the generation endpoints,
      # because Render's free tier has no private networking — every service
      # gets a public URL.
      - key: AI_SERVICE_TOKEN
        generateValue: true

      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false            # paste your Google AI Studio key
      - key: LLM_TIMEOUT_S
        value: "90"

      - key: EMBEDDING_PROVIDER
        value: stub            # retrieval is off until W3; no embedding spend yet
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"

      - key: RETRIEVAL_ENABLED
        value: "false"
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: RETRIEVAL_MIN_SCORE
        value: "0.70"
      - key: PROMPT_TOKEN_CAP
        value: "6000"

      # mongo-local is not a "local only" store — it means similarity is
      # computed in this service rather than by $vectorSearch. It works against
      # Atlas exactly as against a local mongod, so no Atlas Search index is
      # needed before retrieval is switched on.
      - key: VECTOR_STORE
        value: mongo-local
      - key: AI_MONGODB_URI
        sync: false            # same Atlas connection string as below
      - key: AI_MONGODB_DB
        value: ai_script_writer

  # ------------------------------------------- application service + the site
  - type: web
    name: asw
    runtime: docker
    plan: free
    region: oregon
    # Repo root, because the Dockerfile builds client/ as well as server/.
    rootDir: .
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false            # Atlas connection string, database ai_script_writer
      - key: JWT_SECRET
        generateValue: true

      # Full URL including the scheme, e.g. https://asw-ai.onrender.com
      # fromService can supply the host but not a scheme, and the client builds
      # absolute URLs, so this is pasted once after the AI service exists.
      - key: AI_SERVICE_URL
        sync: false
      # Must be the value Render generated on asw-ai. Render cannot copy a
      # generated secret between services, so paste it once.
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: "140000"

      # The site is served from this same service, so there is no cross-origin
      # request to allow. Left pointing at the local dev client, which is the
      # only origin that ever needs it.
      - key: CLIENT_ORIGIN
        value: http://localhost:5173

      - key: GENERATION_RATE_LIMIT_PER_MIN
        value: "5"
      - key: GENERATION_QUOTA_PER_DAY
        value: "50"
